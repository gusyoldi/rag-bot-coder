[project]
name = "po-copilot"
version = "0.1.0"
description = "CLI coach for Product Owners using local RAG"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langgraph",
    "langchain-ollama",
    "langchain-chroma",
    "langchain-text-splitters",
    "chromadb",
    "sentence-transformers",
    "mcp",
    "rich",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires Ollama + ingested Chroma corpus",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
extra_css = "tests/coverage_extra.css"
