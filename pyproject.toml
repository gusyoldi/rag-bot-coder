[project]
name = "po-copilot"
version = "0.1.0"
description = "CLI coach for Product Owners using local RAG"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langgraph",
    "langchain-ollama",
    "langchain-chroma",
    "chromadb",
    "sentence-transformers",
    "mcp",
    "rich",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
